# -----------------------
#  Build stage
# -----------------------
FROM node:20-alpine AS build
WORKDIR /app

# Kopiera package.json + lockfile först (caching)
COPY package*.json ./
RUN npm ci

# Kopiera källkod
COPY . .

# Build-args för Vite-variabler
ARG VITE_IDENTITY_URL
ARG VITE_BOOKING_URL
ARG VITE_EVENT_URL

# Exportera till ENV så npm run build ser dem
ENV VITE_IDENTITY_URL=$VITE_IDENTITY_URL
ENV VITE_BOOKING_URL=$VITE_BOOKING_URL
ENV VITE_EVENT_URL=$VITE_EVENT_URL

# Bygg bundle (dist/)
RUN npm run build

# -----------------------
#  Run stage (Nginx)
# -----------------------
FROM nginx:1.27-alpine

# Egen nginx.conf (SPA fallback)
COPY nginx.conf /etc/nginx/conf.d/default.conf

# Kopiera byggresultatet
COPY --from=build /app/dist /usr/share/nginx/html

EXPOSE 80
CMD ["nginx", "-g", "daemon off;"]
